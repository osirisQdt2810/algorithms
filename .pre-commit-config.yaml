# Lint for dsa-journey (main repo). Run manually on specific files with:
#   pre-commit run --files <file...>
# or install as a git hook once per machine:
#   pre-commit install
# CI (.github/workflows/ci.yml) runs the same hooks on each PR's diff.
#
# NO AUTO-FORMATTER HERE, on purpose. clang-format cannot express this repo's style: it
# always rewrites `for (...){` to `for (...) {` and `n-1` to `n - 1`, and neither has an
# option to turn off. Those are the two things this codebase does deliberately, so an
# auto-formatter would fight every commit. Formatting is the author's call; these hooks only
# catch things that are actually broken.
#
# `end-of-file-fixer` is deliberately absent too — a missing trailing newline is not a bug
# worth rewriting files over.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Trailing whitespace is invisible and never intentional. Archived areas are left
      # alone so finished work is not rewritten.
      - id: trailing-whitespace
        exclude: |
          (?x)^(
            src/leetcode/daily/(2024|2025)_
            |src/leetcode/contests/
            |src/cses/
            |src/vnoi/
            |src/codeforces/
          )
      - id: check-merge-conflict
      - id: check-yaml
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      # The one hook that matters: does it compile? Applies everywhere, archived or not.
      # Two include roots are needed:
      #   -I.       solutions include the shared headers repo-relative
      #             (e.g. #include "topics/graph/disjoint_set_union.hpp")
      #   -Itopics  those headers include each other relative to topics/
      #             (e.g. minimum_spanning_tree.hpp includes "graph/disjoint_set_union.hpp")
      - id: cpp-syntax-check
        name: C++ syntax check (g++ -fsyntax-only)
        entry: g++ -std=c++20 -fsyntax-only -I. -Itopics
        language: system
        types_or: [c++]
