# Lint for dsa-journey (main repo). Run manually on specific files with:
#   pre-commit run --files <file...>
# or install as a git hook once per machine:
#   pre-commit install
# CI (.github/workflows/ci.yml) runs the same hooks on each PR's diff.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        args: [--style=file, -i]

  - repo: local
    hooks:
      - id: cpp-syntax-check
        name: C++ syntax check (g++ -fsyntax-only)
        entry: g++ -std=c++20 -fsyntax-only
        language: system
        types_or: [c++]
